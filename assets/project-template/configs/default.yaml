# 基线配置（single source of truth）。
# 一切超参都写在这里；想临时改用 `--set key.path=value`，不要在代码里写死数字。
# 每个字段都标注了含义，新人也能看懂每个数字在控制什么。

experiment:
  name: baseline          # 实验名；实验目录会是 <name>_<时间戳>_<配置哈希>
  seed: 42                # 全局随机种子，复现的前提（固定 Python/NumPy/Torch）
  output_root: experiments  # 实验产物的根目录，每次运行在其下建一个子目录

# 模型：name 对应 models/ 里的类名，其余字段是它的构造参数
model:
  name: MLP               # 用哪个模型（models/__init__.py 的 _MODELS 字典里的 key）
  in_dim: 16              # 输入特征维度（要和数据集的 in_dim 一致）
  hidden_dim: 64          # 隐藏层宽度，越大容量越强、越易过拟合
  out_dim: 1              # 输出维度（回归任务为 1）
  depth: 2               # 隐藏层层数（>=1），越深表达力越强、越难训

# 数据集：name 对应 datasets/ 里的类名
dataset:
  name: SyntheticRegression  # 用哪个数据集
  n_samples: 2000         # 样本总数
  in_dim: 16              # 输入维度（需与 model.in_dim 一致）
  noise: 0.1              # 合成数据的高斯噪声标准差，越大任务越难
  seed: 0                 # 数据生成种子，与训练种子分开，保证数据本身可复现

# 损失：name 对应 losses/ 里的类名
loss:
  name: MSELoss           # 用哪个损失（换成 CombinedLoss 可引入 alpha 超参做消融）

# 训练超参
train:
  epochs: 20              # 训练总轮数
  batch_size: 64          # 每个 batch 的样本数
  optimizer:
    name: Adam            # 优化器（trainers/optim.py 的 _OPTIMIZERS：Adam/AdamW/SGD）
    lr: 1.0e-3            # 学习率；name 之外的字段都直接传给优化器构造函数
    # weight_decay: 0.0   # 需要时解开注释；SGD 的 momentum 等同理加在这里
  scheduler:
    name: none            # 学习率调度：none 不调度；可选 StepLR / CosineAnnealingLR
    # name: CosineAnnealingLR
    # T_max: 20           # name 之外的字段直接传给调度器构造函数
  val_split: 0.2          # 验证集占比（0~1），从训练集里切出来
  num_workers: 0          # DataLoader 工作进程数；图像等重预处理任务建议调到 4/8
  pin_memory: false       # cuda 训练时设 true 可加速 host->GPU 拷贝
  device: auto            # 计算设备：auto 自动选 cuda/cpu，也可写死 cpu / cuda
  log_interval: 1         # 每多少个 epoch 打印一次日志
  ckpt_interval: 10       # 每多少个 epoch 存一次"周期 checkpoint"（0 表示不存周期档）
  ckpt_keep: 3            # 周期档滚动保留最近几个，旧的自动删（0 表示全保留；best/last 不受影响）
  monitor_metric: mse     # 用哪个指标挑 best.pt（对应 utils/metrics.py 的 key）
  monitor_mode: min       # 监控指标方向：min=越小越好（loss），max=越大越好（准确率/PSNR）
