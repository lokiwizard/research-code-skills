# 实验可变项；命令行覆盖后的有效配置保存在实验目录。
experiment:
  name: mlp                 # 实验名，目录追加时间；重名追加数字后缀
  seed: 42                  # 模型初始化与训练随机种子，不保证跨环境逐位一致
  output_root: experiments  # 实验产物根目录
model:
  name: MLP                 # models 包中的组件名
  in_dim: 16                # 输入维度，须与 dataset.in_dim 一致
  hidden_dim: 64            # 隐藏层宽度，正整数
  out_dim: 1                # 输出维度；本例为单值回归
  depth: 2                  # 隐藏层层数，至少 1
dataset:
  name: SyntheticRegression # 内置合成回归，不需要下载数据
  n_samples: 2000           # 总样本数，划分后两个集合均须非空
  in_dim: 16                # 输入维度
  noise: 0.1                # 高斯噪声标准差，非负
  seed: 0                   # 数据生成种子，与训练种子独立
loss:
  name: MSELoss             # CombinedLoss 支持 alpha 加权项
train:
  epochs: 20                # 总轮数，正整数；续训只允许延长总轮数
  batch_size: 64            # 每批样本数，正整数
  optimizer:
    name: Adam              # Adam、AdamW 或 SGD
    lr: 1.0e-3              # 学习率，正数
  scheduler:
    name: none              # none、StepLR 或 CosineAnnealingLR；参数按构造函数填写
  val_split: 0.2            # 验证集比例，严格位于 (0, 1)
  split_seed: 123           # 固定划分，多训练种子比较时保持不变
  num_workers: 0            # 数据加载进程数，0 表示主进程加载
  pin_memory: false         # CUDA 数据传输可启用锁页内存
  device: auto              # auto 选择 cuda/cpu，也可指定设备
  log_interval: 1           # 日志间隔（epoch），正整数；CSV 每轮保存
  ckpt_interval: 10         # 周期权重间隔；0 不保存周期档，best/last 仍更新
  ckpt_keep: 3              # 最近 N 个周期权重；0 显式保留全部，best/last 不受影响
  eval_interval: 10         # 验证结果快照间隔；0 不保存周期档，best/last 仍更新
  eval_keep: 3              # 最近 N 个验证结果快照；0 显式保留全部
  monitor_metric: mse       # 挑选 best.pt 的验证指标，对应 METRICS 中的键
  monitor_mode: min         # min 越小越好，max 越大越好
